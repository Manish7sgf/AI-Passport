<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Luxurious Metallic Gold Gradient -->
    <linearGradient id="goldLinear" x1="15" y1="5" x2="85" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="55%" stop-color="#D97706" />
      <stop offset="80%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Rich Obsidian Shield Fill -->
    <linearGradient id="shieldDarkBg" x1="50" y1="5" x2="50" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181715" />
      <stop offset="100%" stop-color="#0B0A09" />
    </linearGradient>
  </defs>

  <!-- 1. Outer Faceted Security Shield -->
  <path
    d="M 50 7 L 82 18 L 82 39 C 82 59, 70 78, 50 93 C 30 78, 18 59, 18 39 L 18 18 Z"
    fill="url(#shieldDarkBg)"
    stroke="url(#goldLinear)"
    stroke-width="2.6"
    stroke-linejoin="round"
  />

  <!-- 2. Inner Chiseled Facet Edge -->
  <path
    d="M 50 15 L 75 23 L 75 39 C 75 55, 65 71, 50 84 C 35 71, 25 55, 25 39 L 25 23 Z"
    stroke="url(#goldLinear)"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- 3. 3D Bevel Facet Connecting Struts -->
  <line x1="50" y1="7" x2="50" y2="15" stroke="url(#goldLinear)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="82" y1="18" x2="75" y2="23" stroke="url(#goldLinear)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="82" y1="39" x2="75" y2="39" stroke="url(#goldLinear)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="72" y1="67" x2="66" y2="64" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <line x1="50" y1="93" x2="50" y2="84" stroke="url(#goldLinear)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="28" y1="67" x2="34" y2="64" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <line x1="18" y1="39" x2="25" y2="39" stroke="url(#goldLinear)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="18" y1="18" x2="25" y2="23" stroke="url(#goldLinear)" stroke-width="1.8" stroke-linecap="round" />

  <!-- 4. Concentric Radar Arc Waves (Upper Cavity) -->
  <path d="M 28 44 A 22 22 0 0 1 72 44" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 32 44 A 18 18 0 0 1 68 44" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 36 44 A 14 14 0 0 1 64 44" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 40 44 A 10 10 0 0 1 60 44" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />

  <!-- 5. Inner Swooping Wing Curves Cradling Core -->
  <path d="M 25 28 C 25 48, 38 68, 50 78" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 75 28 C 75 48, 62 68, 50 78" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 25 34 C 26 52, 38 66, 50 73" stroke="url(#goldLinear)" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 75 34 C 74 52, 62 66, 50 73" stroke="url(#goldLinear)" stroke-width="1.4" stroke-linecap="round" />

  <!-- 6. Central Microprocessor Core (Chip) -->
  <!-- Top Pins -->
  <line x1="44" y1="39" x2="44" y2="34" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <line x1="48" y1="39" x2="48" y2="34" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <line x1="52" y1="39" x2="52" y2="34" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <line x1="56" y1="39" x2="56" y2="34" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />

  <!-- Bottom Pins -->
  <line x1="44" y1="57" x2="44" y2="62" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <line x1="48" y1="57" x2="48" y2="62" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <line x1="52" y1="57" x2="52" y2="62" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <line x1="56" y1="57" x2="56" y2="62" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />

  <!-- Left Pins -->
  <line x1="41" y1="45" x2="36" y2="45" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <line x1="41" y1="51" x2="36" y2="51" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />

  <!-- Right Pins -->
  <line x1="59" y1="45" x2="64" y2="45" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />
  <line x1="59" y1="51" x2="64" y2="51" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" />

  <!-- Chip Body -->
  <rect x="41" y="39" width="18" height="18" rx="2.5" fill="#141311" stroke="url(#goldLinear)" stroke-width="1.8" />

  <!-- 3x3 Silicon Matrix / Cells -->
  <rect x="44.5" y="42.5" width="11" height="11" stroke="url(#goldLinear)" stroke-width="1.2" fill="none" />
  <rect x="47.5" y="45.5" width="5" height="5" stroke="url(#goldLinear)" stroke-width="1.2" fill="none" />
  <line x1="47.5" y1="42.5" x2="47.5" y2="45.5" stroke="url(#goldLinear)" stroke-width="1.2" />
  <line x1="52.5" y1="42.5" x2="52.5" y2="45.5" stroke="url(#goldLinear)" stroke-width="1.2" />
  <line x1="47.5" y1="50.5" x2="47.5" y2="53.5" stroke="url(#goldLinear)" stroke-width="1.2" />
  <line x1="52.5" y1="50.5" x2="52.5" y2="53.5" stroke="url(#goldLinear)" stroke-width="1.2" />
  <line x1="44.5" y1="45.5" x2="47.5" y2="45.5" stroke="url(#goldLinear)" stroke-width="1.2" />
  <line x1="52.5" y1="45.5" x2="55.5" y2="45.5" stroke="url(#goldLinear)" stroke-width="1.2" />
  <line x1="44.5" y1="50.5" x2="47.5" y2="50.5" stroke="url(#goldLinear)" stroke-width="1.2" />
  <line x1="52.5" y1="50.5" x2="55.5" y2="50.5" stroke="url(#goldLinear)" stroke-width="1.2" />

  <!-- 7. Lower Converging Topography Waves -->
  <path d="M 32 64 C 40 68, 58 63, 68 64" stroke="url(#goldLinear)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 34 69 C 42 73, 58 68, 66 70" stroke="url(#goldLinear)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 38 75 C 44 78, 56 74, 62 76" stroke="url(#goldLinear)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 43 80 C 47 82, 53 81, 57 82" stroke="url(#goldLinear)" stroke-width="1.5" stroke-linecap="round" />
</svg>
