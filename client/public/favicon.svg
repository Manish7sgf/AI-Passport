<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3BA47" />
      <stop offset="50%" stop-color="#E59820" />
      <stop offset="100%" stop-color="#9E6107" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="14" y1="14" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1816" />
      <stop offset="100%" stop-color="#2D2924" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="16" y1="16" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <path d="M24 4L39 9.5V22C39 31.8 32.6 40.8 24 44C15.4 40.8 9 31.8 9 22V9.5L24 4Z" fill="#141311" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner Hologram Border -->
  <path d="M24 8.5L35.5 12.8V22C35.5 29.8 30.5 37 24 39.8C17.5 37 12.5 29.8 12.5 22V12.8L24 8.5Z" stroke="#F3BA47" stroke-opacity="0.35" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="2 2" />

  <!-- Passport Chip / Core -->
  <rect x="18" y="18" width="12" height="12" rx="2.5" fill="url(#chipGrad)" stroke="url(#neonGlow)" stroke-width="1.5" />

  <!-- Neural Constellation / Chip Contacts -->
  <circle cx="24" cy="24" r="2" fill="#FCD34D" />
  <line x1="24" y1="18" x2="24" y2="22" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />
  <line x1="24" y1="26" x2="24" y2="30" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />
  <line x1="18" y1="24" x2="22" y2="24" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />
  <line x1="26" y1="24" x2="30" y2="24" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />

  <!-- Top Neural Nodes -->
  <circle cx="24" cy="13" r="1.5" fill="#FCD34D" />
  <circle cx="18" cy="15" r="1.2" fill="#F3BA47" />
  <circle cx="30" cy="15" r="1.2" fill="#F3BA47" />
  <line x1="18" y1="15" x2="24" y2="13" stroke="#F3BA47" stroke-width="1" stroke-opacity="0.7" />
  <line x1="30" y1="15" x2="24" y2="13" stroke="#F3BA47" stroke-width="1" stroke-opacity="0.7" />
  <line x1="24" y1="13" x2="24" y2="18" stroke="#F3BA47" stroke-width="1" stroke-opacity="0.7" />

  <!-- Biometric Verification Lines at Base -->
  <path d="M21 34C21 32.5 22.3 31.5 24 31.5C25.7 31.5 27 32.5 27 34" stroke="#FCD34D" stroke-width="1.2" stroke-linecap="round" />
  <path d="M19 36C19 33.5 21.2 32.5 24 32.5C26.8 32.5 29 33.5 29 36" stroke="#FCD34D" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round" />
</svg>
