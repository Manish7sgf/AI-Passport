<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Outer Gold Bevel Gradient -->
    <linearGradient id="crestGold" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="shieldBg" x1="32" y1="6" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1815" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </linearGradient>

    <!-- Chip Core Gradient -->
    <linearGradient id="chipCore" x1="22" y1="22" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#26231E" />
      <stop offset="100%" stop-color="#141311" />
    </linearGradient>

    <!-- Glow Gradient -->
    <linearGradient id="chipGlow" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- 1. Outer Faceted Security Shield -->
  <path
    d="M32 4L54 12V30C54 44.5 44.5 56.5 32 60C19.5 56.5 10 44.5 10 30V12L32 4Z"
    fill="url(#shieldBg)"
    stroke="url(#crestGold)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- 2. Isometric Facet Chiseled Inner Edge -->
  <path
    d="M32 9L49 15.5V29C49 41.5 41 51.8 32 55C23 51.8 15 41.5 15 29V15.5L32 9Z"
    stroke="url(#crestGold)"
    stroke-width="1.2"
    stroke-opacity="0.45"
    stroke-linejoin="round"
  />

  <!-- 3. Skill Radar Concentric Arc Waves -->
  <path
    d="M18 29C18 21.268 24.268 15 32 15C39.732 15 46 21.268 46 29"
    stroke="#F59E0B"
    stroke-width="1.2"
    stroke-opacity="0.35"
    stroke-linecap="round"
    stroke-dasharray="2 3"
  />
  <path
    d="M21.5 29C21.5 23.201 26.201 18.5 32 18.5C37.799 18.5 42.5 23.201 42.5 29"
    stroke="#FCD34D"
    stroke-width="1.4"
    stroke-opacity="0.65"
    stroke-linecap="round"
  />
  <path
    d="M25 29C25 25.134 28.134 22 32 22C35.866 22 39 25.134 39 29"
    stroke="#FDE68A"
    stroke-width="1.5"
    stroke-opacity="0.85"
    stroke-linecap="round"
  />

  <!-- 4. Central Microprocessor Chip -->
  <!-- Chip Pins -->
  <line x1="32" y1="21" x2="32" y2="25" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />
  <line x1="28" y1="21" x2="28" y2="25" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />
  <line x1="36" y1="21" x2="36" y2="25" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />

  <line x1="32" y1="39" x2="32" y2="43" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />
  <line x1="28" y1="39" x2="28" y2="43" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />
  <line x1="36" y1="39" x2="36" y2="43" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />

  <line x1="21" y1="32" x2="25" y2="32" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />
  <line x1="21" y1="28" x2="25" y2="28" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />
  <line x1="21" y1="36" x2="25" y2="36" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />

  <line x1="39" y1="32" x2="43" y2="32" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />
  <line x1="39" y1="28" x2="43" y2="28" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />
  <line x1="39" y1="36" x2="43" y2="36" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" />

  <!-- Chip Body -->
  <rect
    x="24"
    y="24"
    width="16"
    height="16"
    rx="3"
    fill="url(#chipCore)"
    stroke="url(#chipGlow)"
    stroke-width="1.6"
  />

  <!-- Internal Silicon Logic Grid -->
  <rect x="27.5" y="27.5" width="9" height="9" rx="1.5" stroke="#FCD34D" stroke-width="1" stroke-opacity="0.8" fill="#1A1815" />
  <circle cx="32" cy="32" r="1.6" fill="#FDE68A" />

  <!-- 5. Base Converging Proof-of-Work Lines -->
  <path d="M22 47L32 52L42 47" stroke="url(#crestGold)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M26 44L32 47L38 44" stroke="url(#crestGold)" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
